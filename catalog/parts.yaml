schema_version: "0.7"

geometry_cm:
  height_unit:
    value: 1.5
    source: derived_from_user_measurement_6_cm_per_4_units
    confidence: derived
    note: discrete stacking scale; rail height of 1 unit confirmed by user; thin/foundation dimensions remain provisional
  standard_block_footprint:
    width_cm: 4.5
    depth_cm: 4.5
    source: user_measurement
    confidence: measured
  standard_block_stacking_height_cm:
    value: 6.0
    source: user_measurement
    confidence: measured
    note: effective height per standard block in an assembled stack
  standard_block_connector_protrusion_cm:
    value: 1.0
    source: user_measurement
    confidence: measured
    note: inserted into mating piece; not added to effective stacked height
  rail_width_cm:
    value: 4.5
    source: user_measurement
    confidence: measured
  rail_groove_width_cm:
    value: 1.0
    source: user_measurement
    confidence: measured
    note: centered longitudinal channel on the top of straight rails
  rail_groove_depth_cm:
    value: 0.3
    source: viewer_visualization_assumption
    confidence: provisional
    note: groove depth and cross-section profile still need measurement
  rail_hole_diameter_cm:
    value: 1.8
    source: user_approximation
    confidence: approximate
  block_port_diameter_cm:
    value: 1.8
    source: viewer_assumption_using_rail_hole_diameter
    confidence: provisional
    note: actual block opening diameters not measured; face-center placement also provisional

mass_defaults:
  standard_routing_block_g:
    value: 55
    source: temporary_user_assumption
    confidence: provisional
    scope: unmeasured_height_4_routing_blocks

height_units:
  rail: 1 # user confirmed; 1.5 cm derived from 4-unit / 6 cm block scale
  standard_block: 4
  spiral:
    value: 3
    confidence: tentative
  purple_drop_block: 1
  wooden_foundation: 1

routing_blocks:
  yellow:
    height: 4
    rotations_deg: [0, 90, 180, 270]
    ports: [top, front]
    port_visualization: { side_entry_notches: [] }
    routes:
      - { from: top, to: front }
    confidence: confirmed

  blue:
    height: 4
    mass_g:
      value: 53
      source: user_measurement
      confidence: measured
    rotations_deg: [0, 90, 180, 270]
    ports: [top, front, rear, bottom]
    port_visualization: { side_entry_notches: [rear] }
    routes:
      - { from: top, to: front }
      - { from: rear, to: bottom }
    confidence: confirmed

  green:
    height: 4
    rotations_deg: [0, 90, 180, 270]
    ports: [top, front, left, bottom]
    port_visualization: { side_entry_notches: [left] }
    routes:
      - { from: top, to: front }
      - { from: left, to: bottom }
    confidence: confirmed

  cyan:
    height: 4
    rotations_deg: [0, 90, 180, 270]
    ports: [top, front, left, right]
    routes:
      - { from: top, to: front }
      - { from: left, to: right }
      - { from: right, to: left }
    confidence: confirmed

  natural_drop:
    appearance: natural_wood
    height: 4
    rotations_deg: [0, 90, 180, 270]
    ports: [front, rear, bottom]
    port_visualization: { side_entry_notches: [front, rear] }
    routes:
      - { from: front, to: bottom }
      - { from: rear, to: bottom }
    confidence: confirmed_partial
    todo: do not infer any additional ports/routes until physically confirmed

  red_random_split:
    height: 4
    rotations_deg: [0, 90, 180, 270]
    ports: [top, front, rear]
    routes:
      - from: top
        to_any_of: [front, rear]
        selection: random
    confidence: confirmed
    todo: probability distribution is unspecified

  red_right_angle:
    appearance: red
    height: 4
    rotations_deg: [0, 90, 180, 270]
    ports: [top, front, right]
    routes:
      - from: top
        to_any_of: [front, right]
        selection: random
    port_geometry:
      output_angle_deg: 90
    confidence: confirmed
    todo: probability distribution is unspecified

  orange_vertical:
    height: 4
    mass_g:
      value: 58
      source: user_measurement
      confidence: measured
    rotations_deg: [0, 90, 180, 270]
    ports: [top, bottom]
    routes:
      - { from: top, to: bottom }
    horizontal_ports: blocked
    confidence: confirmed

  purple_drop:
    height: 1
    mass_g:
      value: 12
      source: user_measurement
      confidence: measured
    rotations_deg: [0, 90, 180, 270]
    ports: [top, bottom]
    routes:
      - { from: top, to: bottom }
    confidence: confirmed

structural_parts:
  wooden_foundation:
    appearance: natural_wood
    height: 1
    mass_g:
      value: 12
      source: user_measurement
      confidence: measured
    routing: false
    role: foundation
    confidence: confirmed

rails:
  straight_long:
    height: 1
    length_cm: 50
    mass_g:
      value: 135
      source: user_measurement
      confidence: measured
    hole_positions_cm: [2, 7, 43, 48]
    confidence: measured

  straight_long_center:
    height: 1
    length_cm: 50
    mass_g:
      value: 135
      source: user_measurement_assumed_same_physical_rail_family
      confidence: provisional
    hole_positions_cm: [2, 7, 25, 43, 48]
    center_special_mount:
      possible: true
      confidence: partial
      note: some rail variants have a center groove/mount for the seesaw; exact compatibility must be checked
    confidence: measured

  straight_short:
    height: 1
    length_cm: 27
    mass_g:
      value: 74
      source: user_measurement
      confidence: measured
    hole_positions_cm: [2, 7, 20, 25]
    confidence: inferred_from_measured_end_spacing
    todo: confirm all hole centers directly

hole_state_types:
  open:
    description: hole is open and may permit a drop/connection depending on layout
  block_connected:
    description: a block is connected at the hole
  covered:
    description: cover makes the rail route pass over the hole
  covered_slope:
    description: covered slope is fitted; routing semantics still to be defined
    parameters:
      - orientation

accessories:
  routing_affecting:
    cover:
      resulting_hole_state: covered
      confidence: confirmed
    covered_slope:
      aliases:
        - covered_accelerator
        - "フタ付加速パーツ"
      resulting_hole_state: covered_slope
      confidence: partial
      todo: define exact route/behavior and orientation semantics

  non_routing:
    accelerator_plate:
      mass_g:
        value: 2.5
        source: user_measurement
        confidence: measured
      affects_routing_graph: false
      confidence: confirmed
      note: keep for viewer/construction-assist if desired

special_parts:
  seesaw:
    implementation_scope: deferred
    mount:
      location: rail_center
      requires:
        - center_hole
        - center_groove_or_mount
      confidence: confirmed_partial
    ports: [top, left_end, right_end]
    routes:
      - from: top
        to_any_of: [left_end, right_end]
        selection: hysteretic_state
    state:
      type: hysteretic_direction
      approximate_switch_scale_marbles: [4, 5]
      confidence: approximate
      todo: define exact switching rule and threshold
    simplified_solver_model:
      allowed_for_reachability: true
      approximation: branch_to_either_rail_end

  melody_step:
    implementation_scope: deferred
    confidence: product_preset_only

  round_spinner:
    implementation_scope: deferred
    confidence: product_preset_only

  clear_fall:
    implementation_scope: deferred
    confidence: product_preset_only

deferred:
  - curved_rails
  - s_rails
  - seesaw_detailed_state_machine
  - seesaw_geometry
  - spiral_geometry
  - funny_function_special_geometry
