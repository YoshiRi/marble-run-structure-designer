schema_version: "0.3"

height_units:
  rail: 1
  standard_block: 4
  spiral:
    value: 3
    confidence: tentative
  purple_drop_block: 1
  wooden_foundation: 1

routing_blocks:
  yellow:
    height: 4
    rotations_deg: [0, 90, 180, 270]
    ports: [top, front]
    routes:
      - { from: top, to: front }
    confidence: confirmed

  blue:
    height: 4
    rotations_deg: [0, 90, 180, 270]
    ports: [top, front, rear, bottom]
    routes:
      - { from: top, to: front }
      - { from: rear, to: bottom }
    confidence: confirmed

  green:
    height: 4
    rotations_deg: [0, 90, 180, 270]
    ports: [top, front, left, bottom]
    routes:
      - { from: top, to: front }
      - { from: left, to: bottom }
    confidence: confirmed

  cyan:
    height: 4
    rotations_deg: [0, 90, 180, 270]
    ports: [top, front, left, right]
    routes:
      - { from: top, to: front }
      - { from: left, to: right }
      - { from: right, to: left }
    confidence: confirmed

  natural_drop:
    appearance: natural_wood
    height: 4
    rotations_deg: [0, 90, 180, 270]
    ports: [front, rear, bottom]
    routes:
      - { from: front, to: bottom }
      - { from: rear, to: bottom }
    confidence: confirmed_partial
    todo: do not infer any additional ports/routes until physically confirmed

  red_random_split:
    height: 4
    rotations_deg: [0, 90, 180, 270]
    ports: [top, front, rear]
    routes:
      - from: top
        to_any_of: [front, rear]
        selection: random
    confidence: confirmed
    todo: probability distribution is unspecified

  orange_vertical:
    height: 4
    rotations_deg: [0, 90, 180, 270]
    ports: [top, bottom]
    routes:
      - { from: top, to: bottom }
    horizontal_ports: blocked
    confidence: confirmed

  purple_drop:
    height: 1
    rotations_deg: [0, 90, 180, 270]
    ports: [top, bottom]
    routes:
      - { from: top, to: bottom }
    confidence: confirmed

structural_parts:
  wooden_foundation:
    appearance: natural_wood
    height: 1
    routing: false
    role: foundation
    confidence: confirmed

rails:
  straight_long:
    height: 1
    length_cm: 50
    hole_positions_cm: [2, 7, 43, 48]
    confidence: measured

  straight_long_center:
    height: 1
    length_cm: 50
    hole_positions_cm: [2, 7, 25, 43, 48]
    center_special_mount:
      possible: true
      confidence: partial
      note: some rail variants have a center groove/mount for the seesaw; exact compatibility must be checked
    confidence: measured

  straight_short:
    height: 1
    length_cm: 27
    hole_positions_cm: [2, 7, 20, 25]
    confidence: inferred_from_measured_end_spacing
    todo: confirm all hole centers directly

hole_state_types:
  open:
    description: hole is open and may permit a drop/connection depending on layout
  block_connected:
    description: a block is connected at the hole
  covered:
    description: cover makes the rail route pass over the hole
  covered_slope:
    description: covered slope is fitted; routing semantics still to be defined
    parameters:
      - orientation

accessories:
  routing_affecting:
    cover:
      resulting_hole_state: covered
      confidence: confirmed
    covered_slope:
      resulting_hole_state: covered_slope
      confidence: partial
      todo: define exact route/behavior and orientation semantics

  non_routing:
    accelerator_plate:
      affects_routing_graph: false
      confidence: confirmed
      note: keep for viewer/construction-assist if desired

special_parts:
  seesaw:
    implementation_scope: deferred
    mount:
      location: rail_center
      requires:
        - center_hole
        - center_groove_or_mount
      confidence: confirmed_partial
    ports: [top, left_end, right_end]
    routes:
      - from: top
        to_any_of: [left_end, right_end]
        selection: hysteretic_state
    state:
      type: hysteretic_direction
      approximate_switch_scale_marbles: [4, 5]
      confidence: approximate
      todo: define exact switching rule and threshold
    simplified_solver_model:
      allowed_for_reachability: true
      approximation: branch_to_either_rail_end

deferred:
  - curved_rails
  - s_rails
  - seesaw_detailed_state_machine
  - seesaw_geometry
  - spiral_geometry
