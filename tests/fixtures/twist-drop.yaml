schema_version: '0.1'
name: twist-drop
description: 'A block standing on the twist''s first chute hole catches the marble
  from the rail above and lands it on the chute (the chute is a plain rail; its second
  hole is covered); the funnel drops it through its center into a yellow block, which
  sends it out on an exit rail.

  '
