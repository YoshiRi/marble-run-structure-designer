schema_version: "0.1"
name: twist-drop
description: >
  A block standing on the twist's first chute hole catches the marble from the
  rail above and lands it on the chute (the chute is a plain rail; its second
  hole is covered); the funnel drops it through its center into a yellow
  block, which sends it out on an exit rail.
rails:
  - { id: upper, rail_type: straight_short, x_cm: -25, y_cm: 0, z_units: 13, yaw_deg: 0,
      flow_direction: a_to_b, hole_states: { 0: covered, 1: covered, 2: covered, 3: block_connected } }
  # Twist: end A at the chute tip, heading +y to the funnel center (0, 23).
  # Chute holes (0, 0) and (0, 5) mount at 5 + 3 = 8; center hole (0, 23) at 5.
  - { id: twist, rail_type: spiral, x_cm: 0, y_cm: -1.5, z_units: 5, yaw_deg: 90,
      flow_direction: a_to_b, hole_states: { 1: covered, 2: block_connected } }
  - { id: exit, rail_type: straight_short, x_cm: 2.25, y_cm: 23, z_units: 1, yaw_deg: 0,
      flow_direction: a_to_b, hole_states: { 0: covered, 1: covered, 2: covered, 3: covered } }
parts:
  # Column under the upper rail's start (top at 13).
  - { id: u0_f, part_type: wooden_foundation, x_cm: -23, y_cm: 0, z_units: 0 }
  - { id: u0_1, part_type: natural_drop, x_cm: -23, y_cm: 0, z_units: 1 }
  - { id: u0_2, part_type: orange_vertical, x_cm: -23, y_cm: 0, z_units: 5 }
  - { id: u0_3, part_type: cyan, x_cm: -23, y_cm: 0, z_units: 9 }
  # Column under the twist's chute hole (top at 8).
  - { id: t0_f, part_type: wooden_foundation, x_cm: 0, y_cm: 0, z_units: 0 }
  - { id: t0_1, part_type: natural_drop, x_cm: 0, y_cm: 0, z_units: 1 }
  - { id: t0_2, part_type: purple_drop, x_cm: 0, y_cm: 0, z_units: 5 }
  - { id: t0_3, part_type: purple_drop, x_cm: 0, y_cm: 0, z_units: 6 }
  - { id: t0_4, part_type: purple_drop, x_cm: 0, y_cm: 0, z_units: 7 }
  # B stands on the chute hole, front toward the funnel (+y), holds up the upper rail.
  - { id: B, part_type: yellow, x_cm: 0, y_cm: 0, z_units: 9 }
  # Under the funnel center: C catches the marble, front toward +x.
  - { id: c_f, part_type: wooden_foundation, x_cm: 0, y_cm: 23, z_units: 0 }
  - { id: C, part_type: yellow, x_cm: 0, y_cm: 23, z_units: 1, rotation_deg: 270 }
  # Exit rail feet.
  - { id: e1, part_type: wooden_foundation, x_cm: 9.25, y_cm: 23, z_units: 0 }
  - { id: e3, part_type: wooden_foundation, x_cm: 27.25, y_cm: 23, z_units: 0 }
supports:
  - { name: upper_start, upper_rail_id: upper, upper_hole_index: 0, stack_part_ids: [u0_f, u0_1, u0_2, u0_3] }
  - { name: upper_drop, upper_rail_id: upper, upper_hole_index: 3, stack_part_ids: [B],
      lower_rail_id: twist, lower_hole_index: 0 }
  - { name: twist_chute, upper_rail_id: twist, upper_hole_index: 0, stack_part_ids: [t0_f, t0_1, t0_2, t0_3, t0_4] }
  - { name: twist_center, upper_rail_id: twist, upper_hole_index: 2, stack_part_ids: [c_f, C] }
  - { name: exit_near, upper_rail_id: exit, upper_hole_index: 1, stack_part_ids: [e1] }
  - { name: exit_far, upper_rail_id: exit, upper_hole_index: 3, stack_part_ids: [e3] }
route_links:
  - source: { component_id: C, port: front }
    target: { component_id: exit, port: end_a }
routing_query:
  source: { component_id: upper, port: end_a }
  sinks:
    - { component_id: exit, port: end_b }
