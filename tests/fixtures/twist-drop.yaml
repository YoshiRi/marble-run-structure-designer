schema_version: "0.1"
name: twist-drop
description: >
  The feed rail comes in from the left side of the twist's heading and ends
  against the rear notch of a blue block standing on the twist's first chute
  hole (a hook-shaped entry). The second chute hole is covered. The blue drops the marble from its bottom into the
  chute; it circles the funnel and drops through the center hole into a
  yellow block, which sends it out on an exit rail.
rails:
  # Feed rail at the chute's level, flowing +x toward the entry block.
  - { id: feed, rail_type: straight_short, x_cm: -29.25, y_cm: 0, z_units: 8, yaw_deg: 0,
      flow_direction: a_to_b, hole_states: { 0: covered, 1: covered, 2: covered, 3: covered } }
  # Twist: end A at the chute tip, heading +y to the funnel center (0, 23).
  # Chute holes (0, 0) and (0, 5) mount at 5 + 3 = 8; center hole (0, 23) at 5.
  - { id: twist, rail_type: spiral, x_cm: 0, y_cm: -1.5, z_units: 5, yaw_deg: 90,
      flow_direction: a_to_b, hole_states: { 1: covered, 2: block_connected } }
  - { id: exit, rail_type: straight_short, x_cm: 2.25, y_cm: 23, z_units: 1, yaw_deg: 0,
      flow_direction: a_to_b, hole_states: { 0: covered, 1: covered, 2: covered, 3: covered } }
parts:
  # Feed rail columns (top at 8).
  - { id: f0_f, part_type: wooden_foundation, x_cm: -27.25, y_cm: 0, z_units: 0 }
  - { id: f0_1, part_type: natural_drop, x_cm: -27.25, y_cm: 0, z_units: 1 }
  - { id: f0_2, part_type: purple_drop, x_cm: -27.25, y_cm: 0, z_units: 5 }
  - { id: f0_3, part_type: purple_drop, x_cm: -27.25, y_cm: 0, z_units: 6 }
  - { id: f0_4, part_type: purple_drop, x_cm: -27.25, y_cm: 0, z_units: 7 }
  - { id: f2_f, part_type: wooden_foundation, x_cm: -9.25, y_cm: 0, z_units: 0 }
  - { id: f2_1, part_type: orange_vertical, x_cm: -9.25, y_cm: 0, z_units: 1 }
  - { id: f2_2, part_type: purple_drop, x_cm: -9.25, y_cm: 0, z_units: 5 }
  - { id: f2_3, part_type: purple_drop, x_cm: -9.25, y_cm: 0, z_units: 6 }
  - { id: f2_4, part_type: purple_drop, x_cm: -9.25, y_cm: 0, z_units: 7 }
  # Column under the twist's chute hole (top at 8).
  - { id: t0_f, part_type: wooden_foundation, x_cm: 0, y_cm: 0, z_units: 0 }
  - { id: t0_1, part_type: natural_drop, x_cm: 0, y_cm: 0, z_units: 1 }
  - { id: t0_2, part_type: purple_drop, x_cm: 0, y_cm: 0, z_units: 5 }
  - { id: t0_3, part_type: purple_drop, x_cm: 0, y_cm: 0, z_units: 6 }
  - { id: t0_4, part_type: purple_drop, x_cm: 0, y_cm: 0, z_units: 7 }
  # E stands on the first chute hole, rear notch facing -x toward the feed rail.
  - { id: E, part_type: blue, x_cm: 0, y_cm: 0, z_units: 9, rotation_deg: 270 }
  # Under the funnel center: C catches the marble, front toward +x.
  - { id: c_f, part_type: wooden_foundation, x_cm: 0, y_cm: 23, z_units: 0 }
  - { id: C, part_type: yellow, x_cm: 0, y_cm: 23, z_units: 1, rotation_deg: 270 }
  # Exit rail feet.
  - { id: e1, part_type: wooden_foundation, x_cm: 9.25, y_cm: 23, z_units: 0 }
  - { id: e3, part_type: wooden_foundation, x_cm: 27.25, y_cm: 23, z_units: 0 }
supports:
  - { name: feed_start, upper_rail_id: feed, upper_hole_index: 0, stack_part_ids: [f0_f, f0_1, f0_2, f0_3, f0_4] }
  - { name: feed_end, upper_rail_id: feed, upper_hole_index: 2, stack_part_ids: [f2_f, f2_1, f2_2, f2_3, f2_4] }
  # Free-standing: E carries no rail.
  - { name: twist_entry, upper_rail_id: null, upper_hole_index: null, stack_part_ids: [E],
      lower_rail_id: twist, lower_hole_index: 0 }
  - { name: twist_chute, upper_rail_id: twist, upper_hole_index: 0, stack_part_ids: [t0_f, t0_1, t0_2, t0_3, t0_4] }
  - { name: twist_center, upper_rail_id: twist, upper_hole_index: 2, stack_part_ids: [c_f, C] }
  - { name: exit_near, upper_rail_id: exit, upper_hole_index: 1, stack_part_ids: [e1] }
  - { name: exit_far, upper_rail_id: exit, upper_hole_index: 3, stack_part_ids: [e3] }
route_links:
  - source: { component_id: feed, port: end_b }
    target: { component_id: E, port: rear }
  - source: { component_id: C, port: front }
    target: { component_id: exit, port: end_a }
routing_query:
  source: { component_id: feed, port: end_a }
  sinks:
    - { component_id: exit, port: end_b }
