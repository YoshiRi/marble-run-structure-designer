schema_version: '0.1'
name: seesaw-split
description: 'A seesaw on the center hole of a center-hole long rail. A short rail
  above drops the marble through its open hole 8 levels onto the seesaw, which sends
  it to either arm; the host rail carries it outward: dive at hole 1 on the A side,
  off end B on the B side (user, 2026-10-24).'
