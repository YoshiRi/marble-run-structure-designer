schema_version: "0.1"
name: three-level-physically-connected
routing_options:
  allow_side_entry_plus_one: false

rails:
  - id: lower
    rail_type: straight_long_center
    x_cm: 0
    y_cm: 0
    z_units: 1
    yaw_deg: 0
    flow_direction: a_to_b
    hole_states:
      0: covered
      1: covered
      2: covered
      3: covered
      4: covered

  - id: upper
    rail_type: straight_short
    x_cm: 0
    y_cm: 0
    z_units: 6
    yaw_deg: 0
    flow_direction: a_to_b
    hole_states:
      0: block_connected
      3: block_connected

  # The rail begins at the blue block's front opening (x=2, y=2.25).
  # The blue block is installed at z=2u, so its front hole opens at 3u.
  # This rail lies on plain foundations with its groove at 2u, the block's
  # installation level: the marble drops one unit straight out of the hole.
  # (A rail at z=2u, groove 3u, would meet the hole exactly instead.)
  - id: exit
    rail_type: straight_short
    x_cm: 2
    y_cm: 2.25
    z_units: 1
    yaw_deg: 90
    flow_direction: a_to_b
    hole_states:
      0: covered
      1: covered
      2: covered
      3: covered

parts:
  - id: foundation_left
    part_type: wooden_foundation
    x_cm: 2
    y_cm: 0
    z_units: 0

  - id: foundation_right
    part_type: wooden_foundation
    x_cm: 48
    y_cm: 0
    z_units: 0

  - id: blue_column
    part_type: blue
    x_cm: 2
    y_cm: 0
    z_units: 2

  - id: green_column
    part_type: green
    x_cm: 25
    y_cm: 0
    z_units: 2

  # Ground supports under the exit rail: one foundation each, no pedestal.
  - { id: exit_foundation_near, part_type: wooden_foundation, x_cm: 2, y_cm: 9.25, z_units: 0 }
  - { id: exit_foundation_far, part_type: wooden_foundation, x_cm: 2, y_cm: 27.25, z_units: 0 }

supports:
  - name: lower_left_ground
    upper_rail_id: lower
    upper_hole_index: 0
    stack_part_ids: [foundation_left]

  - name: lower_right_ground
    upper_rail_id: lower
    upper_hole_index: 4
    stack_part_ids: [foundation_right]

  - name: upper_left
    upper_rail_id: upper
    upper_hole_index: 0
    stack_part_ids: [blue_column]
    lower_rail_id: lower
    lower_hole_index: 0

  - name: upper_right
    upper_rail_id: upper
    upper_hole_index: 3
    stack_part_ids: [green_column]
    lower_rail_id: lower
    lower_hole_index: 2

  - name: exit_near_ground
    upper_rail_id: exit
    upper_hole_index: 1
    stack_part_ids: [exit_foundation_near]

  - name: exit_far_ground
    upper_rail_id: exit
    upper_hole_index: 3
    stack_part_ids: [exit_foundation_far]

route_links:
  - source:
      component_id: blue_column
      port: front
    target:
      component_id: exit
      port: end_a

# Optional shared query for the browser routing inspector.
routing_query:
  source: { component_id: upper, port: end_a }
  sinks:
    - { component_id: exit, port: end_b }
