schema_version: "0.1"
name: two-level-supported

rails:
  - id: lower
    rail_type: straight_long_center
    x_cm: 0
    y_cm: 0
    z_units: 1
    yaw_deg: 0
    flow_direction: a_to_b
    hole_states:
      0: covered
      1: covered
      2: covered
      3: covered
      4: covered

  - id: upper
    rail_type: straight_short
    x_cm: 0
    y_cm: 0
    z_units: 6
    yaw_deg: 0
    flow_direction: a_to_b
    hole_states:
      0: block_connected
      3: block_connected

parts:
  - id: foundation_left
    part_type: wooden_foundation
    x_cm: 2
    y_cm: 0
    z_units: 0

  - id: foundation_right
    part_type: wooden_foundation
    x_cm: 48
    y_cm: 0
    z_units: 0

  - id: blue_column
    part_type: blue
    x_cm: 2
    y_cm: 0
    z_units: 2

  - id: green_column
    part_type: green
    x_cm: 25
    y_cm: 0
    z_units: 2

supports:
  - name: lower_left_ground
    upper_rail_id: lower
    upper_hole_index: 0
    stack_part_ids: [foundation_left]

  - name: lower_right_ground
    upper_rail_id: lower
    upper_hole_index: 4
    stack_part_ids: [foundation_right]

  - name: upper_left
    upper_rail_id: upper
    upper_hole_index: 0
    stack_part_ids: [blue_column]
    lower_rail_id: lower
    lower_hole_index: 0

  - name: upper_right
    upper_rail_id: upper
    upper_hole_index: 3
    stack_part_ids: [green_column]
    lower_rail_id: lower
    lower_hole_index: 2

# No route link: the blue front exit has no mating rail in this 2-level
# structural example. Do not invent a path into the lower rail.
route_links: []

# Optional shared query for the browser routing inspector.
routing_query:
  source: { component_id: upper, port: end_a }
  sinks:
    - { component_id: blue_column, port: front }
