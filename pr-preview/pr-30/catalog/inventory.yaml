schema_version: "0.2"
name: owned

# The user's own collection (core set + Twist set), counted by hand on
# 2026-10-25. The raw count, in the user's own words, is
# catalog/owned-count-2026-10-25.json; this file maps it to catalog ids.
# Null means UNKNOWN, not unlimited. Mappings marked "check" are Claude's
# reading of the user's names and await confirmation.

parts:
  routing_blocks:
    yellow: 14            # 黄色 9 + 5
    blue: 12              # 青紫 6 (core) + 青 6 (Twist) - check: 青紫 = blue
    green: 14             # 緑 6 + 8
    cyan: 13              # 水色 6 + 7
    natural_drop: 6       # 白木（ナチュラル）2 + 4
    red_random_split: 10  # 赤（穴の向き違い）4 + 6 - check
    red_right_angle: 2    # 赤（横穴あり）1 + 1 - check
    orange_vertical: 10   # オレンジ 6 + 4
    purple_drop: 39       # 濃い紫/グレー 15 (core) + 薄い紫ブロック 24 (Twist) - check: core's are the thin purple too

  structural_parts:
    wooden_foundation: 10 # 薄い白木ブロック (Twist)
    plate_two_holes: 4
    plate_three_holes: 2
    plate_four_corner_holes: 4

  rails:
    # 長いレール; how many have the center hole (seesaw mount) is unknown.
    # straight_long_center draws from this pool until it is counted.
    straight_long: 3
    straight_short: 8     # 中くらいのレール = the 27 cm rail
    curved_short: 5
    curved_long: 6
    s_curve: 2

  special_parts:
    seesaw: 4             # 赤い切り替え（シーソー）2 + 2
    spiral: 2             # うずまきパーツ

  routing_accessories:
    cover: null
    covered_slope: null

  non_routing_accessories:
    accelerator_plate: null

# Counted but not in the catalog yet (the solver ignores this section).
unmodeled:
  straight_shorter: 2          # 短いレール: shorter than the 27 cm rail; length and holes unmeasured
  plate_one_hole: 10           # プレート 1つ穴
  red_large_tray: 1            # 赤い大きな受け皿/レール
  green_large_tray: 1          # 緑の大きな受け皿/レール
  red_small_slope: 20          # 赤い小さな傾斜パーツ 10 + 10 (cover / covered_slope / accelerator? check)
  natural_small_slope: 10      # 白木の小さな傾斜パーツ 5 + 5 (check)
  marbles: 200

notes:
  - "Do not infer owned counts from commercial set specifications."
  - "Null is treated as unknown by InventoryValidator."
  - "Curved rails, S-curves and hole plates are listed so they can be counted; the solver does not use them yet."
