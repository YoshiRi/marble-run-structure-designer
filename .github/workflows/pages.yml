name: viewer-static-site

on:
  push:
    branches: [main]
    paths:
      - "viewer/**"
      - "catalog/**"
      - "examples/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check browser JavaScript
        run: node --check viewer/app.js
      - name: Assemble static site
        run: |
          mkdir -p _site
          cp viewer/index.html _site/index.html
          cp viewer/app.js _site/app.js
          cp viewer/styles.css _site/styles.css
          cp -r catalog _site/catalog
          cp -r examples _site/examples
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name == 'workflow_dispatch'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
