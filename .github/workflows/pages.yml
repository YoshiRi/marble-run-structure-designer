name: viewer-static-site

# Production deploy of the viewer to the gh-pages branch root.
# PR previews live under pr-preview/ on the same branch (see pr-preview.yml),
# so this deploy must neither delete that directory nor force-push.

on:
  push:
    branches: [main]
    paths:
      - "viewer/**"
      - "catalog/**"
      - "examples/**"
      - "scripts/build_site.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble static site
        run: scripts/build_site.sh _site
      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          folder: _site
          branch: gh-pages
          clean-exclude: pr-preview/
          force: false
