<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Marble Run Layout Gallery</title>
  <link rel="stylesheet" href="./styles.css">
  <style>
    .gallery-page { max-width: 1200px; margin: 0 auto; padding: 0 max(12px, env(safe-area-inset-right)) 48px max(12px, env(safe-area-inset-left)); }
    .gallery-bar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px;
      padding: max(8px, env(safe-area-inset-top)) 0 8px; background: Canvas; border-bottom: 1px solid var(--border); }
    .gallery-bar h1 { margin: 0; font-size: 17px; flex: 1; }
    .gallery-bar a, .gallery-bar button {
      min-height: 40px; display: inline-flex; align-items: center; padding: 6px 12px; border: 1px solid var(--border);
      border-radius: 8px; background: Canvas; color: CanvasText; font-size: 14px; text-decoration: none; cursor: pointer;
    }
    .gallery-bar .primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    .gallery-intro { margin: 10px 0 0; color: var(--muted); font-size: 13px; line-height: 1.6; max-width: 70ch; }
    .gallery-section h2 { margin: 22px 0 10px; font-size: 15px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
    @media (max-width: 560px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } }
    .card { position: relative; display: grid; gap: 6px; align-content: start; padding: 8px; border: 1px solid var(--border);
      border-radius: 12px; background: var(--panel); min-width: 0; }
    .card.reviewed { border-color: color-mix(in srgb, var(--accent) 55%, var(--border)); }
    .card-main { display: grid; gap: 6px; color: inherit; text-decoration: none; }
    .card-main:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
    .thumb { display: block; width: 100%; aspect-ratio: 480 / 430; object-fit: cover; border-radius: 8px; background: #111827; }
    .thumb-empty { display: flex; align-items: center; justify-content: center; font-size: 34px; color: #fbbf24; }
    .card-title { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card-stats { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12px; color: var(--muted); }
    .card-stats b { color: CanvasText; font-weight: 600; }
    .card-links { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; }
    .card-links a, .card-links button { color: var(--accent); text-decoration: none; background: none; border: 0; padding: 4px 0; font: inherit; cursor: pointer; }
    .card-links .danger { color: #dc2626; }
    .layout-id { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .review-tools { display: grid; gap: 6px; padding-top: 6px; border-top: 1px dashed var(--border); }
    .id-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; }
    .copy-id { border: 1px solid var(--border); border-radius: 7px; background: Canvas; color: CanvasText; font-size: 12px; padding: 4px 8px; cursor: pointer; }
    .tags { display: flex; flex-wrap: wrap; gap: 4px; }
    .tag { font-size: 10px; padding: 1px 6px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
    .metrics { margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 3px 8px; font-size: 11px; }
    .metrics div { display: grid; }
    .metrics dt { color: var(--muted); font-size: 10px; }
    .metrics dd { margin: 0; font-variant-numeric: tabular-nums; }
    .marks { display: flex; flex-wrap: wrap; gap: 4px; }
    .mark { min-height: 30px; padding: 4px 8px; border: 1px solid var(--border); border-radius: 7px; background: Canvas; color: CanvasText; font-size: 12px; cursor: pointer; }
    .mark[aria-pressed="true"] { background: color-mix(in srgb, var(--accent) 18%, Canvas); border-color: var(--accent); }
    .mark:focus-visible, .copy-id:focus-visible, .gallery-bar a:focus-visible, .gallery-bar button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .note { width: 100%; min-width: 0; box-sizing: border-box; border: 1px solid var(--border); border-radius: 7px; background: Canvas; color: CanvasText; padding: 6px 8px; font: inherit; font-size: 13px; }
    .summary { margin-top: 24px; display: grid; gap: 8px; }
    .summary h2 { margin: 0; font-size: 15px; }
    .summary textarea { width: 100%; box-sizing: border-box; min-height: 110px; border: 1px solid var(--border); border-radius: 8px; background: Canvas; color: CanvasText; padding: 10px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
    .status { min-height: 1.4em; color: var(--muted); font-size: 12px; }
    body:not(.debug) .debug-only { display: none !important; }
  </style>
</head>
<body>
  <div class="gallery-page">
    <header class="gallery-bar">
      <a href="./index.html" data-i18n="gal.viewer">← Viewer</a>
      <h1 data-i18n="gal.title">Layout Gallery</h1>
      <button id="copySummary" type="button" class="primary debug-only" data-i18n="gal.copySummary">Copy review summary</button>
    </header>
    <p class="gallery-intro debug-only" data-i18n-html="gal.intro"></p>
    <section id="mineSection" class="gallery-section" hidden>
      <h2 data-i18n="mine.group">My layouts</h2>
      <div id="mineGrid" class="grid"></div>
    </section>
    <section class="gallery-section">
      <h2 data-i18n="gal.examples">Examples</h2>
      <p id="status" class="status debug-only" aria-live="polite"></p>
      <main id="grid" class="grid" aria-label="Layouts">
        <p class="status" data-i18n="gal.loading">Loading layouts…</p>
      </main>
    </section>
    <section class="summary debug-only">
      <h2 data-i18n="gal.summary">Review summary</h2>
      <textarea id="summary" readonly aria-label="Review summary"></textarea>
    </section>
  </div>
  <script src="./i18n.js"></script>
  <script src="./gallery.js"></script>
</body>
</html>
